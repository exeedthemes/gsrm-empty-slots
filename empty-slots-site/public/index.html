<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GSRM Empty SOD Slots</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="panel controls-panel">
        <div class="title-row">
          <div>
            <h1>Empty SOD Slots</h1>
            <p>Flight Comms staff coverage scanner</p>
          </div>
          <button id="runBtn" class="primary-btn" type="button">Run</button>
        </div>

        <form id="scanForm" autocomplete="off">
          <div class="grid two">
            <label>
              <span>Email</span>
              <input id="email" name="email" type="email" required>
            </label>
            <label>
              <span>Password</span>
              <input id="password" name="password" type="password" required>
            </label>
          </div>

          <div class="grid four">
            <label>
              <span>Start date</span>
              <input id="startDate" name="startDate" type="date" value="2026-06-04" required>
            </label>
            <label>
              <span>End date</span>
              <input id="endDate" name="endDate" type="date" value="2026-06-04" required>
            </label>
            <label>
              <span>From UTC</span>
              <input id="startTime" name="startTime" type="time" value="00:00" required>
            </label>
            <label>
              <span>To UTC</span>
              <input id="endTime" name="endTime" type="time" value="23:59" required>
            </label>
          </div>

          <fieldset class="day-picker">
            <legend>Days</legend>
            <label><input type="checkbox" name="days" value="1" checked><span>Mon</span></label>
            <label><input type="checkbox" name="days" value="2" checked><span>Tue</span></label>
            <label><input type="checkbox" name="days" value="3" checked><span>Wed</span></label>
            <label><input type="checkbox" name="days" value="4" checked><span>Thu</span></label>
            <label><input type="checkbox" name="days" value="5" checked><span>Fri</span></label>
            <label><input type="checkbox" name="days" value="6"><span>Sat</span></label>
            <label><input type="checkbox" name="days" value="0"><span>Sun</span></label>
          </fieldset>

          <div class="holiday-row">
            <label class="holiday-toggle">
              <input id="includePublicHolidays" name="includePublicHolidays" type="checkbox">
              <span>Include public holidays</span>
            </label>
            <label class="holiday-dates">
              <span>Extra holiday dates</span>
              <input id="publicHolidays" name="publicHolidays" type="text" placeholder="Optional: 2026-08-08">
            </label>
          </div>

          <div class="filter-grid">
            <label class="filter-control">
              <span>Airlines</span>
              <div class="filter-select-row">
                <select id="airlines" name="airlines" multiple size="6">
                  <option value="">All airlines</option>
                </select>
                <button id="airlinesBtn" class="secondary-btn" type="button">Refresh</button>
              </div>
            </label>
            <label class="filter-control">
              <span>SLA</span>
              <select id="slas" name="slas" multiple size="6">
                <option value="">All SLAs</option>
                <option value="CKIN">CKIN</option>
                <option value="GATE">GATE</option>
                <option value="LOFO">LOFO</option>
                <option value="QH-CKI">QH-CKI</option>
                <option value="QH-GATE">QH-GATE</option>
                <option value="ASVC">ASVC</option>
                <option value="SECS">SECS</option>
              </select>
            </label>
          </div>
        </form>
      </section>

      <section class="status-strip" aria-live="polite">
        <div>
          <span class="metric" id="resultCount">0</span>
          <span>empty slot groups</span>
        </div>
        <div>
          <span class="metric" id="flightCount">0</span>
          <span>flights scanned</span>
        </div>
        <div>
          <span class="metric" id="dateCount">0</span>
          <span>dates scanned</span>
        </div>
        <button id="csvBtn" class="secondary-btn" type="button" disabled>Download CSV</button>
      </section>

      <section id="progressPanel" class="progress-panel" aria-live="polite" hidden>
        <div class="progress-main">
          <div>
            <span class="progress-label">Date</span>
            <strong id="progressDate">-</strong>
          </div>
          <div>
            <span class="progress-label">Flight</span>
            <strong id="progressFlight">-</strong>
          </div>
          <div>
            <span class="progress-label">Elapsed</span>
            <strong id="progressElapsed">0s</strong>
          </div>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="progressText" class="progress-text">Starting...</div>
        <div id="progressDates" class="progress-dates"></div>
      </section>

      <section class="panel table-panel">
        <div id="message" class="message">Ready.</div>
        
        <div class="table-filter-bar">
          <div class="filter-search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input id="resultsSearch" type="text" placeholder="Filter output results (flight, route, date...)" class="search-input">
          </div>
          
          <div class="filter-selects">
            <div class="filter-group">
              <label for="resultsSlaFilter">SLA</label>
              <select id="resultsSlaFilter">
                <option value="">All SLAs</option>
              </select>
            </div>
            
            <div class="filter-group">
              <label for="resultsDirectionFilter">Direction</label>
              <select id="resultsDirectionFilter">
                <option value="">All</option>
                <option value="Arrival">ARR</option>
                <option value="Departure">DEP</option>
              </select>
            </div>

            <div class="filter-group">
              <label for="resultsMissingFilter">Min Missing</label>
              <select id="resultsMissingFilter">
                <option value="">Any</option>
                <option value="1">1+</option>
                <option value="2">2+</option>
                <option value="3">3+</option>
                <option value="4">4+</option>
              </select>
            </div>

            <div class="filter-group">
              <label for="resultsStartTimeFilter">From UTC</label>
              <input id="resultsStartTimeFilter" type="time" class="filter-time-input">
            </div>
            
            <div class="filter-group">
              <label for="resultsEndTimeFilter">To UTC</label>
              <input id="resultsEndTimeFilter" type="time" class="filter-time-input">
            </div>

            <div class="filter-group toggle-group">
              <label class="toggle-label">
                <input id="resultsLocalTimeToggle" type="checkbox">
                <span>Local Time</span>
              </label>
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Flight</th>
                <th>Route</th>
                <th>SLA</th>
                <th>Required</th>
                <th>Assigned</th>
                <th>Missing</th>
                <th id="thStart">Start UTC</th>
                <th id="thRelease">Release UTC</th>
                <th>Duration</th>
              </tr>
            </thead>
            <tbody id="resultsBody">
              <tr><td colspan="10" class="empty">No scan run yet.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
